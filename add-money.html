<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Money - FFBazar</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
body { background: #f5f7fa; padding-bottom: 70px; }
.header { background: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
.logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; color: #0047ab; }
.logo img { height: 40px; }
.balance { background: #0047ab; color: #fff; padding: 8px 15px; border-radius: 25px; font-size: 14px; font-weight: bold; display: flex; align-items: center; gap: 5px; }
.container { padding: 15px 10px; }
.back-btn { background: #666; color: #fff; padding: 8px 15px; border: none; border-radius: 6px; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
.section { background: #fff; padding: 20px 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.section h2 { font-size: 18px; margin-bottom: 15px; color: #1a2a4a; }
.input-field { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; font-size: 15px; outline:none; }
.input-field:focus { border-color: #0047ab; }
.btn-blue { width: 100%; background: #0047ab; color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; }
.btn-blue:active { background:#003580; }
.note { font-size:12px; color:#666; margin-top:-10px; margin-bottom:15px; }
</style>
</head>
<body>

<div class="header">
  <div class="logo"><img src="wallet.png" alt=""> FFBazar</div>
  <div class="balance"><i data-lucide="wallet"></i> <span id="headerBalance">0.00</span>৳</div>
</div>

<div class="container">
  <button class="back-btn" onclick="window.location.href='index.html'"><i data-lucide="arrow-left"></i> Back</button>
  
  <div class="section">
    <h2>Add Money</h2>
    <label style="font-weight:bold; margin-bottom:8px; display:block;">Enter the amount</label>
    <input type="number" id="addAmount" class="input-field" placeholder="Minimum 10 TK" min="10">
    <p class="note">* 10 TK থেকে 5000 TK পর্যন্ত Add করতে পারবেন</p>
    <button class="btn-blue" onclick="goToPayment()">Click Here To Add Money</button>
  </div>
</div>

<script>
lucide.createIcons();

// Page load হলেই Balance দেখাবে
window.onload = function() {
  loadBalance();
}

function loadBalance() {
  let balance = localStorage.getItem('walletBalance') || 0;
  document.getElementById('headerBalance').innerText = parseFloat(balance).toFixed(2);
}

function goToPayment() {
  let amount = document.getElementById('addAmount').value;
  
  if(!amount || amount < 10) { 
    alert("Minimum 10 TK Add করতে হবে"); 
    return; 
  }
  if(amount > 5000) {
    alert("Maximum 5000 TK Add করতে পারবেন");
    return;
  }

  // এই লাইনটার জন্যই payment.html এ টাকা দেখাবে
  localStorage.setItem('addMoneyAmount', amount); 
  
  // তারপর payment page এ পাঠাবে
  window.location.href = 'payment.html'; 
}
</script>
</body>
      </html>
