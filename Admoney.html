<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout - ffbazar</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
body { background: #f5f7fa; padding-bottom: 60px; }
.header { background: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.header b { font-size: 16px; color: #1a2a4a; }
.container { padding: 30px 15px; text-align: center; }
.wallet-circle { width: 120px; height: 120px; border: 3px solid #0047ab; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 16px; font-weight: bold; color: #0047ab; background:#fff; }
.wallet-text { font-size: 22px; font-weight: bold; color: #666; margin-bottom: 20px; }
.btn-blue { width: 100%; background: #0047ab; color: #fff; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
.payment-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 30px; }
.pay-card { background: #fff; border: 2px solid #ddd; border-radius: 10px; padding: 20px 10px; cursor: pointer; transition:0.2s; }
.pay-card.active { border-color: #0047ab; background:#e6f0ff; }
.pay-card img { height: 40px; }
.pay-btn { position: fixed; bottom: 0; left: 0; width: 100%; background: #e6f0ff; color: #0047ab; padding: 18px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; border-top:1px solid #cce0ff; }
.close-btn { background:none; border:none; font-size:24px; cursor:pointer; color:#666; }
</style>
</head>
<body>

<div class="header">
  <button class="close-btn" onclick="window.location.href='add-money.html'">×</button>
  <b>Secure Checkout - Wallet</b>
  <div></div>
</div>

<div class="container">
  <div class="wallet-circle">Wallet</div>
  <div class="wallet-text">Wallet</div>

  <button class="btn-blue">Mobile Banking</button>

  <div class="payment-grid">
    <div class="pay-card active" onclick="selectMethod(this, 'bKash')">
      <img src="images/bkash.png" alt="bKash">
    </div>
    <div class="pay-card" onclick="selectMethod(this, 'Nagad')">
      <img src="images/nogod.png" alt="Nagad">
    </div>
  </div>
</div>

<button class="pay-btn" id="payBtn" onclick="confirmPayment()">Pay 0.00</button>

<script>
let amount = localStorage.getItem('addMoneyAmount') || 0;
let method = 'bKash';

// এখানেই যত টাকা লিখবা তত দেখাবে Pay 40.00 / Pay 500.00
document.getElementById('payBtn').innerText = `Pay ${parseFloat(amount).toFixed(2)}`;

function selectMethod(el, m) {
  document.querySelectorAll('.pay-card').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  method = m;
}

function confirmPayment() {
  if(amount <= 0) { alert("Amount 0"); return; }
  alert(`${amount} TK ${method} এর মাধ্যমে Add Money Request পাঠানো হয়েছে।\nAdmin Approve করলে Balance Add হবে।`);
  
  // Demo: Direct Balance Add করে দিলাম। পরে Admin Approve System লাগবে
  let currentBalance = parseFloat(localStorage.getItem('walletBalance') || 0);
  let newBalance = currentBalance + parseFloat(amount);
  localStorage.setItem('walletBalance', newBalance);
  
  window.location.href = 'index.html';
}
</script>
</body>
  </html>
