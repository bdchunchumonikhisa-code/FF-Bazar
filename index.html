<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FF Bazar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-100">

<!-- Navbar -->
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="container mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-blue-600">FF Bazar</h1>
    <div id="auth-section">
      <button id="login-btn" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">Login with Google</button>
      <div id="user-info" class="hidden items-center gap-3">
        <img id="user-pic" class="w-8 h-8 rounded-full">
        <span id="user-name" class="font-semibold"></span>
        <button id="logout-btn" class="bg-red-500 text-white px-3 py-1 rounded-lg text-sm">Logout</button>
      </div>
    </div>
  </div>
</nav>

<!-- Admin Panel - Only for Admin -->
<div id="admin-panel" class="hidden container mx-auto mt-6 p-6 bg-white rounded-lg shadow">
  <h2 class="text-xl font-bold mb-4">Add New Product</h2>
  <input id="p-name" type="text" placeholder="Product Name" class="border p-2 w-full mb-2 rounded">
  <input id="p-price" type="number" placeholder="Price" class="border p-2 w-full mb-2 rounded">
  <input id="p-img" type="text" placeholder="Image URL" class="border p-2 w-full mb-2 rounded">
  <button id="add-product-btn" class="bg-green-600 text-white px-4 py-2 rounded-lg">Add Product</button>
</div>

<!-- Products -->
<div class="container mx-auto mt-6 px-4">
  <h2 class="text-2xl font-bold mb-4">All Products</h2>
  <div id="products-list" class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Products will load here -->
  </div>
</div>

<script type="module">
  // 1. Firebase Config - তোমার আগের config ই
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "ff-bazar-4c198.firebaseapp.com",
    projectId: "ff-bazar-4c198",
    storageBucket: "ff-bazar-4c198.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  // 2. তোমার Admin Email এখানে বসাও
  const ADMIN_EMAIL = "eshankhisaa@gmail.com"; 

  // 3. Login Logout
  const loginBtn = document.getElementById('login-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userInfo = document.getElementById('user-info');
  const adminPanel = document.getElementById('admin-panel');

  loginBtn.onclick = () => signInWithPopup(auth, provider);
  logoutBtn.onclick = () => signOut(auth);

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBtn.classList.add('hidden');
      userInfo.classList.remove('hidden');
      userInfo.classList.add('flex');
      document.getElementById('user-pic').src = user.photoURL;
      document.getElementById('user-name').innerText = user.displayName;
      
      // Admin check
      if(user.email === ADMIN_EMAIL){
        adminPanel.classList.remove('hidden');
      }
    } else {
      loginBtn.classList.remove('hidden');
      userInfo.classList.add('hidden');
      adminPanel.classList.add('hidden');
    }
  });

  // 4. Add Product - Only Admin
  document.getElementById('add-product-btn').onclick = async () => {
    const name = document.getElementById('p-name').value;
    const price = document.getElementById('p-price').value;
    const img = document.getElementById('p-img').value;
    await addDoc(collection(db, "products"), { name, price, img });
    alert("Product Added!");
    loadProducts();
  }

  // 5. Load Products
  async function loadProducts() {
    const querySnapshot = await getDocs(collection(db, "products"));
    const list = document.getElementById('products-list');
    list.innerHTML = "";
    querySnapshot.forEach((doc) => {
      const p = doc.data();
      list.innerHTML += `
        <div class="bg-white p-4 rounded-lg shadow">
          <img src="${p.img}" class="w-full h-40 object-cover rounded">
          <h3 class="font-bold mt-2">${p.name}</h3>
          <p class="text-blue-600 font-semibold">৳${p.price}</p>
        </div>
      `;
    });
  }
  loadProducts();

</script>
</body>
</html>
