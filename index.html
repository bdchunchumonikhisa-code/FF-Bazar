<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FFBAZAR - Login</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:#f6f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .app{
      width:100%;
      max-width:430px;
      min-height:650px;
      background:#fff;
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 15px 50px rgba(0,0,0,.12);
      position:relative;
    }

    /* HEADER */

    .header{
      background:#fff;
      padding:25px 24px 18px;
      border-bottom:1px solid #eee;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    /* FFBazar Logo */

    .logo{
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
    }

    .logo-icon{
      width:48px;
      height:48px;
      border-radius:14px;
      background:linear-gradient(135deg,#7c3aed,#0891b2);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-size:22px;
      box-shadow:0 7px 20px rgba(124,58,237,.35);
    }

    .logo-text{
      font-size:25px;
      font-weight:800;
      letter-spacing:1px;
      color:#171725;
    }

    .logo-text span{
      color:#7c3aed;
    }

    /* CONTENT */

    .content{
      padding:35px 28px;
    }

    .welcome{
      text-align:center;
      margin-bottom:28px;
    }

    .welcome h1{
      font-size:26px;
      color:#171725;
      font-weight:700;
    }

    .welcome p{
      color:#8b8b99;
      font-size:13px;
      margin-top:6px;
    }

    /* Google Button */

    .google-btn{
      width:100%;
      height:54px;
      border:1px solid #ddd;
      background:#fff;
      border-radius:14px;
      cursor:pointer;
      font-size:15px;
      font-weight:600;
      color:#333;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      transition:.2s;
    }

    .google-btn:hover{
      background:#f8f8f8;
      transform:translateY(-1px);
    }

    .google-icon{
      width:22px;
      height:22px;
    }

    /* Divider */

    .divider{
      display:flex;
      align-items:center;
      gap:12px;
      margin:25px 0;
      color:#aaa;
      font-size:12px;
    }

    .divider::before,
    .divider::after{
      content:"";
      height:1px;
      background:#e7e7e7;
      flex:1;
    }

    /* INPUT */

    .input-group{
      margin-bottom:16px;
    }

    .input-group label{
      display:block;
      font-size:13px;
      font-weight:600;
      color:#444;
      margin-bottom:7px;
    }

    .input-box{
      position:relative;
    }

    .input-box i{
      position:absolute;
      left:17px;
      top:50%;
      transform:translateY(-50%);
      color:#9a9a9a;
    }

    .input-box input{
      width:100%;
      height:52px;
      border:1px solid #ddd;
      border-radius:13px;
      outline:none;
      padding:0 16px 0 46px;
      font-size:14px;
      transition:.2s;
    }

    .input-box input:focus{
      border-color:#7c3aed;
      box-shadow:0 0 0 3px rgba(124,58,237,.1);
    }

    /* BUTTON */

    .login-btn{
      width:100%;
      height:54px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#7c3aed,#0891b2);
      color:#fff;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      margin-top:5px;
      box-shadow:0 8px 22px rgba(124,58,237,.25);
      transition:.2s;
    }

    .login-btn:hover{
      transform:translateY(-2px);
    }

    .login-btn:active{
      transform:scale(.98);
    }

    /* SWITCH */

    .switch-text{
      text-align:center;
      margin-top:22px;
      font-size:13px;
      color:#777;
    }

    .switch-text button{
      border:none;
      background:none;
      color:#7c3aed;
      font-weight:700;
      cursor:pointer;
      font-size:13px;
    }

    /* USER PAGE */

    #userPage{
      display:none;
      padding:40px 25px;
      text-align:center;
    }

    .profile-img{
      width:90px;
      height:90px;
      border-radius:50%;
      margin:0 auto 18px;
      background:linear-gradient(135deg,#7c3aed,#0891b2);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:35px;
      color:#fff;
      font-weight:700;
      overflow:hidden;
    }

    .profile-img img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .user-name{
      font-size:21px;
      font-weight:700;
      color:#171725;
    }

    .user-email{
      font-size:13px;
      color:#888;
      margin-top:5px;
      word-break:break-word;
    }

    .logout-btn{
      margin-top:30px;
      width:100%;
      height:52px;
      border:none;
      border-radius:14px;
      background:#fff0f0;
      color:#e53935;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
    }

    .footer{
      position:absolute;
      bottom:18px;
      left:0;
      width:100%;
      text-align:center;
      color:#aaa;
      font-size:11px;
    }

    .hidden{
      display:none!important;
    }

    @media(max-width:480px){

      body{
        padding:0;
        background:#fff;
      }

      .app{
        min-height:100vh;
        border-radius:0;
        box-shadow:none;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <!-- HEADER LOGO -->

  <div class="header">

    <div class="logo">

      <div class="logo-icon">
        <i class="fa-solid fa-fire"></i>
      </div>

      <div class="logo-text">
        FF<span>BAZAR</span>
      </div>

    </div>

  </div>


  <!-- LOGIN / REGISTER CONTENT -->

  <div class="content" id="authPage">


    <!-- LOGIN -->

    <div id="loginView">

      <div class="welcome">
        <h1>Welcome Back 👋</h1>
        <p>Login to continue with FFBAZAR</p>
      </div>


      <!-- GOOGLE LOGIN -->

      <button class="google-btn" onclick="googleLogin()">

        <img
          class="google-icon"
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google">

        Continue with Google

      </button>


      <div class="divider">
        <span>OR</span>
      </div>


      <div class="input-group">

        <label>Email Address</label>

        <div class="input-box">

          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email">

        </div>

      </div>


      <div class="input-group">

        <label>Password</label>

        <div class="input-box">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password">

        </div>

      </div>


      <button class="login-btn" onclick="emailLogin()">

        <i class="fa-solid fa-right-to-bracket"></i>
        Login

      </button>


      <div class="switch-text">

        New user?

        <button onclick="showRegister()">
          Create Account
        </button>

      </div>

    </div>


    <!-- REGISTER -->

    <div id="registerView" class="hidden">

      <div class="welcome">
        <h1>Create Account 🚀</h1>
        <p>Join FFBAZAR today</p>
      </div>


      <button class="google-btn" onclick="googleLogin()">

        <img
          class="google-icon"
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google">

        Sign up with Google

      </button>


      <div class="divider">
        <span>OR</span>
      </div>


      <div class="input-group">

        <label>Email Address</label>

        <div class="input-box">

          <i class="fa-solid fa-envelope"></i>

          <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email">

        </div>

      </div>


      <div class="input-group">

        <label>Password</label>

        <div class="input-box">

          <i class="fa-solid fa-lock"></i>

          <input
            type="password"
            id="registerPassword"
            placeholder="Minimum 6 characters">

        </div>

      </div>


      <button class="login-btn" onclick="registerUser()">

        <i class="fa-solid fa-user-plus"></i>
        Create Account

      </button>


      <div class="switch-text">

        Already have an account?

        <button onclick="showLogin()">
          Login
        </button>

      </div>

    </div>


  </div>


  <!-- USER PAGE -->

  <div id="userPage">

    <div class="profile-img" id="profileImage">
      U
    </div>

    <div class="user-name" id="userName">
      User
    </div>

    <div class="user-email" id="userEmail">
      user@email.com
    </div>


    <button class="logout-btn" onclick="logoutUser()">

      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      Logout

    </button>

  </div>


  <div class="footer">
    © 2026 FFBAZAR
  </div>

</div>


<script>

/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

  apiKey: "AIzaSyA-VQMjqAhIB33bc8Pm79voqB_OvwWrjzE",

  authDomain: "ff-bazar-4c198.firebaseapp.com",

  projectId: "ff-bazar-4c198",

  storageBucket: "ff-bazar-4c198.firebasestorage.app",

  messagingSenderId: "1090990307122",

  appId: "1:1090990307122:web:22f6b02df43b818b49092b",

  measurementId: "G-VY6LVKJRFX"

};


/* =====================================
   INITIALIZE FIREBASE
===================================== */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const googleProvider = new firebase.auth.GoogleAuthProvider();


/* =====================================
   SHOW REGISTER
===================================== */

function showRegister(){

  document.getElementById("loginView").classList.add("hidden");

  document.getElementById("registerView").classList.remove("hidden");

}


/* =====================================
   SHOW LOGIN
===================================== */

function showLogin(){

  document.getElementById("registerView").classList.add("hidden");

  document.getElementById("loginView").classList.remove("hidden");

}


/* =====================================
   GOOGLE LOGIN
===================================== */

async function googleLogin(){

  try{

    Swal.fire({
      title:"Please wait...",
      text:"Opening Google Login",
      allowOutsideClick:false,
      didOpen:()=>{
        Swal.showLoading();
      }
    });

    const result = await auth.signInWithPopup(googleProvider);

    Swal.close();

    showUser(result.user);

    Swal.fire({
      icon:"success",
      title:"Login Successful!",
      timer:1500,
      showConfirmButton:false
    });

  }

  catch(error){

    Swal.close();

    console.error(error);

    Swal.fire({
      icon:"error",
      title:"Google Login Failed",
      text:error.message
    });

  }

}


/* =====================================
   EMAIL LOGIN
===================================== */

async function emailLogin(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if(!email || !password){

    Swal.fire({
      icon:"warning",
      title:"Information Missing",
      text:"Please enter email and password"
    });

    return;

  }


  try{

    Swal.fire({
      title:"Logging in...",
      allowOutsideClick:false,
      didOpen:()=>{
        Swal.showLoading();
      }
    });

    const result =
      await auth.signInWithEmailAndPassword(
        email,
        password
      );

    Swal.close();

    showUser(result.user);


    Swal.fire({
      icon:"success",
      title:"Welcome to FFBAZAR!",
      timer:1500,
      showConfirmButton:false
    });

  }

  catch(error){

    Swal.close();

    Swal.fire({
      icon:"error",
      title:"Login Failed",
      text:error.message
    });

  }

}


/* =====================================
   REGISTER USER
===================================== */

async function registerUser(){

  const email =
    document.getElementById("registerEmail").value.trim();

  const password =
    document.getElementById("registerPassword").value;


  if(!email || !password){

    Swal.fire({
      icon:"warning",
      title:"Information Missing",
      text:"Please enter email and password"
    });

    return;

  }


  if(password.length < 6){

    Swal.fire({
      icon:"warning",
      title:"Password Too Short",
      text:"Password must be at least 6 characters"
    });

    return;

  }


  try{

    Swal.fire({
      title:"Creating Account...",
      allowOutsideClick:false,
      didOpen:()=>{
        Swal.showLoading();
      }
    });


    const result =
      await auth.createUserWithEmailAndPassword(
        email,
        password
      );


    Swal.close();

    showUser(result.user);


    Swal.fire({
      icon:"success",
      title:"Account Created!",
      timer:1800,
      showConfirmButton:false
    });

  }

  catch(error){

    Swal.close();

    Swal.fire({
      icon:"error",
      title:"Registration Failed",
      text:error.message
    });

  }

}


/* =====================================
   SHOW USER
===================================== */

function showUser(user){

  document.getElementById("authPage").style.display = "none";

  document.getElementById("userPage").style.display = "block";


  document.getElementById("userName").innerText =
    user.displayName || "FFBAZAR User";


  document.getElementById("userEmail").innerText =
    user.email || "";


  const profileImage =
    document.getElementById("profileImage");


  if(user.photoURL){

    profileImage.innerHTML =
      `<img src="${user.photoURL}" alt="Profile">`;

  }

  else{

    const firstLetter =
      (user.email || "U").charAt(0).toUpperCase();

    profileImage.innerText = firstLetter;

  }

}


/* =====================================
   LOGOUT
===================================== */

async function logoutUser(){

  try{

    await auth.signOut();


    document.getElementById("userPage").style.display =
      "none";


    document.getElementById("authPage").style.display =
      "block";


    Swal.fire({
      icon:"success",
      title:"Logged Out",
      timer:1200,
      showConfirmButton:false
    });


  }

  catch(error){

    Swal.fire({
      icon:"error",
      title:"Logout Failed",
      text:error.message
    });

  }

}


/* =====================================
   AUTO LOGIN CHECK
===================================== */

auth.onAuthStateChanged(function(user){

  if(user){

    showUser(user);

  }

  else{

    document.getElementById("userPage").style.display =
      "none";


    document.getElementById("authPage").style.display =
      "block";

  }

});

</script>

</body>
</html>
