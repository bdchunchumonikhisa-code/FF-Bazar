<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFBAZAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary: #7c3aed;
            --primary-dark: #7c3aed;
            --secondary: #0891b2;
            --accent: #f59e0b;
            --background: #faf8fc;
            --surface: #ffffff;
            --surface-alt: #f6f2fb;
            --text: #1e1b2e;
            --muted: #6b7280;
            --border: #ece5f7;
            --success: #16a34a;
            --warning: #fbbf24;
            --danger: #dc2626;
            --gradient-cta: linear-gradient(135deg, #0ea5e9 0%, #0891b2 100%);
            --radius-card: 14px;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.35);
        }
        * {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: var(--background);
            background-image:
                radial-gradient(circle at 15% 0%, rgba(124, 58, 237, 0.06), transparent 40%),
                radial-gradient(circle at 100% 20%, rgba(8, 145, 178, 0.06), transparent 45%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary {
            background: var(--gradient-cta) !important;
            border: none !important;
            clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
            position: relative;
        }
        .btn-primary:active {
            filter: brightness(0.95);
        }
        /* Diamond-shaped step markers -- nods to the product being sold */
        .step-badge {
            background-color: var(--primary) !important;
            transform: rotate(45deg);
            border-radius: 3px !important;
        }
        .step-badge .step-num {
            display: inline-block;
            transform: rotate(-45deg);
        }

        /* Home Panel Specific Font */
        #home-sec {
            font-family: 'Space Grotesk', sans-serif;
        }
        #account-sec {
            font-family: 'Space Grotesk', sans-serif;
        }
        #tutorial-sec {
            font-family: 'Space Grotesk', sans-serif;
        }

        .nav-gradient {
            background: var(--surface);
            color: var(--text);
            border-top: 1px solid var(--border);
        }
        .active-tab {
            color: var(--primary) !important;
        }
        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
        }
        .nav-item .nav-icon-wrap {
            color: #9ca3af;
        }
        .nav-item .nav-label {
            max-width: 0;
            opacity: 0;
            margin-left: 0;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .nav-item.active-tab .nav-icon-wrap {
            background: var(--gradient-cta);
            color: #ffffff;
            padding-left: 14px;
            padding-right: 14px;
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.35);
        }
        .nav-item.active-tab .nav-label {
            max-width: 100px;
            opacity: 1;
            margin-left: 6px;
        }
        .nav-item:active .nav-icon-wrap {
            transform: scale(0.94);
        }
        .app-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }
        .hidden {
            display: none !important;
        }

        .font-en {
            font-family: 'Poppins', sans-serif;
        }
        .font-bn {
            font-family: 'Noto Serif Bengali', serif;
        }

        #home-sec .lang-auto {
            font-family: 'Space Grotesk', sans-serif;
        }
        .lang-auto:lang(bn),
        .lang-auto:lang(bn-BD) {
            font-family: 'Noto Serif Bengali', serif;
        }

        .notice-scroll {
            animation: scroll-left 15s linear infinite;
            display: inline-block;
            white-space: nowrap;
        }
        @keyframes scroll-left {
            0% {
                transform: translateX(100%);
            }
            100% {
                transform: translateX(-100%);
            }
        }

        .method-card {
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .method-card:active {
            transform: scale(0.95);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .animate-fade-in {
            animation: fadeInUp 0.4s ease-out forwards;
        }

        /* PRODUCT CARD */
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .product-card:hover {
            border-color: var(--primary);
        }
        .product-card.selected {
            border: 1.5px solid var(--primary);
            background-color: rgba(56, 189, 248, 0.12);
        }
        .product-bullet {
            height: 12px;
            width: 12px;
            background-color: var(--border);
            border-radius: 50%;
            margin-right: 8px;
        }
        .product-card.selected .product-bullet {
            background-color: var(--primary);
        }

        /* FAB */
        #fab-container.is-open #fab-toggler {
            background-color: #dc2626;
        }
        #fab-container.is-open #fab-icon-open {
            transform: rotate(-180deg) scale(0);
            opacity: 0;
        }
        #fab-container.is-open #fab-icon-close {
            transform: scale(1) rotate(0);
            opacity: 1;
        }
        #fab-container.is-open #fab-options {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .aspect-video {
            aspect-ratio: 16 / 9;
        }

        /* Step Transition */
        .step-transition {
            animation: slideInRight 0.3s ease-out forwards;
        }
        @keyframes slideInRight {
            from {
                transform: translateX(10%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .theme-bkash {
            background-color: #e2136e !important;
            border-color: #e2136e !important;
        }
        .theme-nagad {
            background-color: #f7941d !important;
            border-color: #f7941d !important;
        }
        .theme-rocket {
            background-color: #8c3494 !important;
            border-color: #8c3494 !important;
        }

        .text-theme-bkash {
            color: #e2136e !important;
        }
        .text-theme-nagad {
            color: #f7941d !important;
        }
        .text-theme-rocket {
            color: #8c3494 !important;
        }

        /* PAYMENT OPTION CARD */
        .pay-option-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .pay-option-card.selected {
            border: 2px solid var(--primary);
        }
        .pay-option-card.selected::before {
            content: '\f00c';
            font-family: 'Font Awesome 5 Free';
            font-weight: 900;
            position: absolute;
            top: 0;
            left: 0;
            background: var(--primary);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-bottom-right-radius: 6px;
            z-index: 10;
        }

        /* Related Products */
        .related-card {
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .related-card:hover {
            border-color: var(--primary);
            background: var(--surface);
        }
        .related-card.selected {
            border: 1.5px solid var(--primary);
            background-color: rgba(56, 189, 248, 0.12);
        }

        /* Offer Card */
        .offer-card {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid var(--warning);
            border-radius: var(--radius-card);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        .offer-card::before {
            content: "🔥 SPECIAL OFFER";
            position: absolute;
            top: 8px;
            right: -40px;
            transform: rotate(45deg);
            background: #dc2626;
            color: white;
            font-size: 9px;
            font-weight: 800;
            padding: 4px 50px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .offer-card .offer-price {
            font-size: 28px;
            font-weight: 800;
            color: #dc2626;
        }
        .offer-card .original-price {
            font-size: 16px;
            color: var(--muted);
            text-decoration: line-through;
            margin-left: 10px;
        }
        .offer-card .discount-badge {
            background: #dc2626;
            color: white;
            padding: 3px 14px;
            clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
            font-size: 12px;
            font-weight: 700;
            display: inline-block;
        }
        .countdown-timer {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            font-family: 'Inter', monospace;
        }
        .countdown-timer .time-block {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            padding: 6px 14px;
            text-align: center;
            min-width: 50px;
        }
        .countdown-timer .time-block .num {
            font-size: 22px;
            font-weight: 800;
            color: #1e1b2e;
            line-height: 1.2;
        }
        .countdown-timer .time-block .label {
            font-size: 8px;
            text-transform: uppercase;
            color: #6b7280;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .offer-expired {
            opacity: 0.6;
            filter: grayscale(0.5);
        }
        .offer-expired .countdown-timer .time-block .num {
            color: #6b7280;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--surface-alt);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>
