<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - FFBazar</title>
<style>
body { background:#f5f7fa; font-family:'SolaimanLipi', Arial; padding:20px; }
.login-box,.admin-box { background:#fff; max-width:750px; margin:30px auto; padding:25px; border-radius:12px; box-shadow:0 5px 20px rgba(0,0,0,0.1); }
h2 { text-align:center; color:#0047ab; margin-bottom:20px; }
input { width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px; box-sizing:border-box; font-size:16px; }
.btn { width:100%; background:#0047ab; color:#fff; padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px; }
.request-card { background:#f9f9f9; padding:15px; margin-bottom:15px; border-radius:8px; border-left:5px solid #ff9800; }
.request-card p { margin:6px 0; font-size:14px; }
.approve-btn { background:#4CAF50; color:#fff; padding:8px 18px; border:none; border-radius:5px; cursor:pointer; margin-right:10px; font-weight:bold; }
.reject-btn { background:#f44336; color:#fff; padding:8px 18px; border:none; border-radius:5px; cursor:pointer; font-weight:bold; }
.logout { background:#f44336; margin-bottom:20px; }
</style>
</head>
<body>

<!-- Login Box -->
<div class="login-box" id="loginBox">
  <h2>Admin Login</h2>
  <input type="email" id="adminEmail" placeholder="Admin Email">
  <input type="password" id="adminPass" placeholder="Admin Password">
  <button class="btn" onclick="adminLogin()">Login</button>
</div>

<!-- Admin Panel -->
<div class="admin-box" id="adminBox" style="display:none;">
  <h2>FFBazar Admin Panel</h2>
  <button class="btn logout" onclick="adminLogout()">Logout</button>
  <h3>Pending Add Money Requests</h3>
  <div id="requestList">Loading...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, query, where, orderBy, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA-VQMjqAhIB33bc8Pm79voqB_OvwWrjzE",
  authDomain: "ff-bazar-4c198.firebaseapp.com",
  projectId: "ff-bazar-4c198",
  storageBucket: "ff-bazar-4c198.firebasestorage.app",
  messagingSenderId: "1090990307122",
  appId: "1:1090990307122:web:22f6b02df43b818b49092b",
  measurementId: "G-VY6LVKJRFX"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginBox = document.getElementById('loginBox');
const adminBox = document.getElementById('adminBox');

// Admin Login
window.adminLogin = () => {
  let email = document.getElementById('adminEmail').value;
  let pass = document.getElementById('adminPass').value;
  signInWithEmailAndPassword(auth, email, pass)
  .then(() => { showAdminPanel(); })
  .catch((e) => { alert("Login Failed: " + e.message); });
}

// Logout
window.adminLogout = () => {
  signOut(auth);
}

// Check Login State
onAuthStateChanged(auth, (user) => {
  if (user) {
    showAdminPanel();
  } else {
    loginBox.style.display = 'block';
    adminBox.style.display = 'none';
  }
});

function showAdminPanel() {
  loginBox.style.display = 'none';
  adminBox.style.display = 'block';
  loadRequests();
}

// Load Requests from Firebase
async function loadRequests() {
  const q = query(collection(db, "addMoneyRequests"), where("status", "==", "pending"), orderBy("time", "desc"));
  const querySnapshot = await getDocs(q);
  let html = '';
  if(querySnapshot.empty){
    html = '<p style="text-align:center; color:gray;">কোনো Pending Request নাই</p>';
  } else {
    querySnapshot.forEach((docSnap) => {
      let req = docSnap.data();
      html += `
      <div class="request-card">
        <p><b>User UID:</b> ${req.uid}</p>
        <p><b>Email:</b> ${req.email}</p>
        <p><b>Amount:</b> ${req.amount} TK</p>
        <p><b>Method:</b> ${req.method}</p>
        <p><b>TXN ID:</b> ${req.txid}</p>
        <p><b>Time:</b> ${new Date(req.time).toLocaleString('bn-BD')}</p>
        <button class="approve-btn" onclick="approveRequest('${docSnap.id}', '${req.uid}', ${req.amount})">Approve</button>
        <button class="reject-btn" onclick="rejectRequest('${docSnap.id}')">Reject</button>
      </div>`;
    });
  }
  document.getElementById('requestList').innerHTML = html;
}

// Approve Request - আগের Balance এর সাথে যোগ হবে
window.approveRequest = async (docId, uid, amount) => { 
  try { 
    const userRef = doc(db, "wallets", uid); 
    await updateDoc(userRef, { 
      balance: increment(Number(amount)) // আগেরটার সাথে যোগ
    }); 

    const reqRef = doc(db, "addMoneyRequests", docId); 
    await updateDoc(reqRef, { status: "approved" }); 

    alert(amount + " TK Approve করা হয়েছে!"); 
    loadRequests(); 
  } catch (e) { 
    alert("Error: " + e.message); 
  } 
}

// Reject Request
window.rejectRequest = async (docId) => {
  try {
    const reqRef = doc(db, "addMoneyRequests", docId);
    await updateDoc(reqRef, { status: "rejected" });
    alert("Request Reject করা হয়েছে!");
    loadRequests();
  } catch(e) {
    alert("Error: " + e.message);
  }
}
</script>
</body>
</html>
