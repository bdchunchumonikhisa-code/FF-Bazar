<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - FFBazar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f7fa}
.header{background:#fff;padding:15px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.header img{height:40px}
.amount-box{text-align:center;padding:20px;font-size:22px;color:#555}
.pay-select{background:#0047ab;color:#fff;width:90%;margin:0 auto 20px auto;padding:15px;border-radius:10px;text-align:center;font-weight:bold;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;padding:0 15px 100px 15px}
.card{background:#fff;border:2px solid #eee;border-radius:10px;padding:20px;text-align:center;cursor:pointer}
.card img{height:50px}
.bottom{position:fixed;bottom:0;left:0;width:100%;background:#e8f0ff;padding:18px;text-align:center;font-size:18px;font-weight:bold;color:#0047ab;border-top:1px solid #ddd}
</style>
</head>
<body>
<div class="header"><img src="images/ffbazar.png"></div>
<h2 style="text-align:center;padding:15px 0;color:#666">TOP UP FFBazar</h2>
<div class="pay-select">মোবাইল ব্যাংকিং</div>
<div class="grid">
<div class="card" onclick="goPay('bkash')"><img src="images/bkash.png"></div>
<div class="card" onclick="goPay('nagad')"><img src="images/nagod.png"></div>
</div>
<div class="bottom">পে করুন <span id="payAmount">0.00</span> ৳</div>
<script>
document.getElementById('payAmount').innerText=localStorage.getItem('amount')+'.00';
function goPay(method){
  localStorage.setItem('gateway',method);
  if(method=='bkash'){window.location.href='bkash-pay.html'}
  else{window.location.href='nagad-pay.html'}
}
</script>
</body>
</html>
